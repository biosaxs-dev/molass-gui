name: Build Portable Windows Zip

# Runs automatically right after upload_to_pypi.yml pushes its version tag
# (by then that workflow's PyPI publish step has already completed, so the
# tag's dependency versions should be live), and can also be re-run manually
# for testing without needing a new tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build portable zip
        run: python scripts/build_portable.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: molass-gui-portable-win64
          path: dist/*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
