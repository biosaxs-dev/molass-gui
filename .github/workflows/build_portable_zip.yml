name: Build Portable Windows Zip

# Deliberately NOT triggered by `push: tags:` -- upload_to_pypi.yml pushes
# its version tag using the default GITHUB_TOKEN, and GitHub Actions
# intentionally does not let GITHUB_TOKEN-authored pushes trigger other
# workflows (anti-recursion safeguard). A plain `push: tags:` trigger here
# would therefore silently never fire. `workflow_run` instead listens for
# that workflow's own completion, which isn't subject to that restriction.
on:
  workflow_run:
    workflows: ["Manual Upload Python Package to PyPI"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Pin to the exact commit the PyPI-publish run acted on (defaults
          # to the default branch's *latest* commit otherwise, which may
          # have moved on since) -- irrelevant for a manual workflow_dispatch
          # run, which has no workflow_run event to read this from.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Read pinned Python version
        id: pyver
        shell: bash
        run: echo "version=$(grep -m1 '^PYTHON_VERSION = ' scripts/build_portable.py | sed 's/PYTHON_VERSION = //;s/"//g')" >> "$GITHUB_OUTPUT"

      - name: Set up Python (exact version pinned in build_portable.py)
        uses: actions/setup-python@v5
        with:
          # Must match build_portable.py's PYTHON_VERSION exactly, not just
          # major.minor -- that script copies Tcl/Tk from *this* interpreter
          # into the (separately pinned) embeddable runtime it bundles, and
          # different 3.14.x patch releases have shipped different Tcl/Tk
          # major versions (8.6 vs 9.0, incompatible DLL names and layout).
          # Read dynamically above rather than duplicated here so there's
          # only one place (PYTHON_VERSION) to update when it changes.
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Build portable zip
        run: python scripts/build_portable.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: molass-gui-portable-win64
          path: dist/*.zip

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | sed 's/version *= *//;s/"//g')" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*.zip
